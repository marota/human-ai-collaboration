# ---------------------------------------------------------------------------
# Jekyll config — GitHub Pages
# Remplacer <USERNAME> et <REPO> par tes valeurs avant le premier push.
# Si le dépôt s'appelle <USERNAME>.github.io, laisser baseurl vide.
# ---------------------------------------------------------------------------

title: "Human–AI Joint Decision-Making in Critical Systems"
tagline: "Design and evaluation criteria for AI decision support where errors are physical and irreversible"
description: >-
  A ten-part series, an explainer video and a curated reference base on how
  humans and AI actually make joint decisions in critical infrastructure —
  and on what it would take to deploy and trust these systems reliably.

author:
  name: "Antoine Marot"
  orcid: "0000-0003-1753-5493"   # <-- décommenter une fois l'ORCID créé

url: "https://marota.github.io"
baseurl: "/human-ai-collaboration"          # ex. "/human-ai-decision" — vide si dépôt <USERNAME>.github.io

# Thème maison (voir _layouts/, _includes/, assets/css/main.css) — pas de gem theme.
lang: en

# ---------------------------------------------------------------------------
# Interrupteurs de fonctionnalités.
# Un `feature:` posé sur une entrée de nav ou une carte d'accueil la masque tant
# que le drapeau correspondant est faux. Pour publier AVEC les projets :
#   jekyll build --config _config.yml,_config.with-projects.yml
# ou, dans l'action GitHub Pages, lancer le workflow avec include_projects=true.
# ---------------------------------------------------------------------------
features:
  projects: false

# Navigation principale — l'ordre ici est l'ordre affiché.
nav:
  - title: The series
    url: /series/
  - title: Explainer video
    url: /video/
  - title: Projects
    url: /projects/
    feature: projects
  - title: Ecosystem map
    url: /map/
  - title: References
    url: /references/
  - title: About
    url: /about/

collections:
  series:
    output: true
    permalink: /series/:name/

defaults:
  - scope:
      path: ""
      type: "series"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  # Réactivés par _config.with-projects.yml, qui redéclare cette liste sans eux.
  - projects
  - assets/img/projects
