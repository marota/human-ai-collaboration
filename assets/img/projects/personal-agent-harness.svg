<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-labelledby="ttl desc"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="ttl">Personal Agent Harness architecture</title>
  <desc id="desc">A request goes to an orchestrator model, which plans, splits the task and delegates. Each delegated sub-task starts a fresh executor with no conversation history, running on a second model; only its final summary returns. The orchestrator then verifies that summary against the actual artefacts — re-reading diffs, re-running tests, re-checking sources — before synthesising an answer. Both models run locally through Ollama, so no data leaves the machine. Alongside the generic path, the orchestrator can call dedicated capabilities: benchmarked local tools and workflows such as a deterministic entity tagger, a transcription pipeline and an evaluation runner. Delegation depth is capped at one, and at most two executors run in parallel.</desc>

  <style>
    .lbl   { fill:#45443f; font-size:12.5px; }
    .sm    { fill:#6b6b6b; font-size:10.5px; }
    .ttl   { fill:#ffffff; font-size:14px; font-weight:700; }
    .ttl2  { fill:#ffffff; font-size:11px; }
    .cap   { fill:#1f2937; font-size:11.5px; font-weight:600; }
    .band  { fill:#8a8a8a; font-size:10px; font-weight:700; letter-spacing:.06em; }
    .flow  { stroke:#6b6b6b; stroke-width:1.6; fill:none; }
    .flowb { stroke:#4a3f9c; stroke-width:2.2; fill:none; }
    .back  { stroke:#c25038; stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
    .boxl  { fill:#f2f1ec; stroke:#d8d6cd; }
    .capbx { fill:#ffffff; stroke:#bcb4ec; }
    @media (prefers-color-scheme: dark) {
      .lbl  { fill:#d8dade; } .sm { fill:#9aa0a8; } .cap { fill:#e7e9ec; }
      .band { fill:#79828d; }
      .flow { stroke:#9aa0a8; } .back { stroke:#e09263; }
      .boxl { fill:#1b2027; stroke:#2c333c; }
      .capbx{ fill:#161a20; stroke:#5b4fa8; }
    }
  </style>

  <!-- lanes -->
  <text class="band" x="24" y="52">YOU</text>
  <text class="band" x="24" y="176">PLAN &amp; VERIFY</text>
  <text class="band" x="24" y="330">EXECUTE (ISOLATED)</text>
  <text class="band" x="24" y="486">CAPABILITIES</text>

  <!-- request -->
  <rect class="boxl" x="150" y="26" width="200" height="40" rx="8"/>
  <text class="lbl" x="250" y="51" text-anchor="middle">Request</text>

  <!-- orchestrator -->
  <rect x="150" y="130" width="330" height="76" rx="10" fill="#4a3f9c"/>
  <text class="ttl" x="315" y="158" text-anchor="middle">Orchestrator — qwen3.6</text>
  <text class="ttl2" x="315" y="178" text-anchor="middle">plans · splits · delegates · verifies · synthesises</text>
  <text class="ttl2" x="315" y="194" text-anchor="middle" opacity="0.8">"a summary is not proof"</text>

  <!-- executors -->
  <rect x="150" y="288" width="220" height="66" rx="10" fill="#1b6a51"/>
  <text class="ttl" x="260" y="313" text-anchor="middle">Executor — gemma4</text>
  <text class="ttl2" x="260" y="332" text-anchor="middle">fresh context · goal + context only</text>
  <rect x="386" y="288" width="94" height="66" rx="10" fill="#1b6a51" opacity="0.45"/>
  <text class="ttl2" x="433" y="318" text-anchor="middle">2nd executor</text>
  <text class="ttl2" x="433" y="334" text-anchor="middle" opacity="0.85">(max 2)</text>

  <!-- arrows down / up -->
  <path class="flow" d="M250 66 V126" marker-end="url(#a)"/>
  <path class="flowb" d="M250 206 V284" marker-end="url(#ab)"/>
  <text class="sm" x="258" y="235">delegate_task(goal, context, toolsets)</text>
  <path class="back" d="M330 288 V210" marker-end="url(#ar)"/>
  <text class="sm" x="338" y="262">final summary only</text>

  <!-- verification loop -->
  <rect class="boxl" x="540" y="130" width="250" height="76" rx="10"/>
  <text class="cap" x="665" y="154" text-anchor="middle">Verification</text>
  <text class="sm" x="665" y="173" text-anchor="middle">re-read diffs · re-run tests</text>
  <text class="sm" x="665" y="189" text-anchor="middle">re-check sources</text>
  <path class="flow" d="M480 168 H536" marker-end="url(#a)"/>

  <!-- answer -->
  <rect class="boxl" x="850" y="130" width="200" height="76" rx="10"/>
  <text class="cap" x="950" y="163" text-anchor="middle">Synthesis</text>
  <text class="sm" x="950" y="182" text-anchor="middle">back to you</text>
  <path class="flow" d="M790 168 H846" marker-end="url(#a)"/>

  <!-- capabilities -->
  <rect class="capbx" x="150" y="440" width="200" height="62" rx="9"/>
  <text class="cap" x="250" y="464" text-anchor="middle">Entity tagger</text>
  <text class="sm" x="250" y="482" text-anchor="middle">deterministic · 0.4 s · reproducible</text>

  <rect class="capbx" x="366" y="440" width="200" height="62" rx="9"/>
  <text class="cap" x="466" y="464" text-anchor="middle">Transcription pipeline</text>
  <text class="sm" x="466" y="482" text-anchor="middle">local ASR · diarisation</text>

  <rect class="capbx" x="582" y="440" width="200" height="62" rx="9"/>
  <text class="cap" x="682" y="464" text-anchor="middle">Evaluation runner</text>
  <text class="sm" x="682" y="482" text-anchor="middle">scores artefacts, not prompts</text>

  <rect class="capbx" x="798" y="440" width="252" height="62" rx="9" stroke-dasharray="5 4"/>
  <text class="cap" x="924" y="464" text-anchor="middle">…any local tool</text>
  <text class="sm" x="924" y="482" text-anchor="middle">benchmarked, then connected</text>

  <path class="flow" d="M300 354 V436" marker-end="url(#a)"/>
  <path class="flow" d="M430 354 C 430 400, 466 400, 466 436" marker-end="url(#a)"/>
  <text class="sm" x="510" y="392">called when the task matches</text>

  <!-- runtime -->
  <rect class="boxl" x="850" y="288" width="200" height="66" rx="10"/>
  <text class="cap" x="950" y="313" text-anchor="middle">Ollama · localhost</text>
  <text class="sm" x="950" y="332" text-anchor="middle">no data leaves the machine</text>
  <path class="flow" d="M480 200 C 700 240, 780 280, 846 310"/>
  <path class="flow" d="M480 320 H846"/>

  <!-- bounds -->
  <rect class="boxl" x="850" y="372" width="200" height="52" rx="9"/>
  <text class="cap" x="950" y="392" text-anchor="middle">Hard bounds</text>
  <text class="sm" x="950" y="410" text-anchor="middle">spawn depth 1 · flat, inspectable</text>

  <text class="sm" x="150" y="560">Sub-agents cannot ask for clarification — anything needing a judgement call is never delegated.</text>
  <text class="sm" x="150" y="580">Every locally built tool becomes agent-callable: the rig gets more capable, and real use sharpens the tool.</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#6b6b6b"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#4a3f9c"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 z" fill="#c25038"/></marker>
  </defs>
</svg>
