<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="ttl desc">
  <title id="ttl">OperatorAudioScribe pipeline architecture</title>
  <desc id="desc">Shift handover audio or video: media ingestion; ASR, diarisation and word-level alignment (whisper.cpp, pyannote, wav2vec2); entity detection and matching against the domain taxonomy; moment extraction (qwen3:8b); outputs and timeline.html; then a human annotation loop that biases later transcriptions and feeds a per-zone entity memory. Enriched detection, July 2026: probable entity tags per word before annotation, then doubt raised on confident common words (domain phrases, jargon homophones, spelled-out acronyms, units). Deterministic detection exposed as the tag_entities skill of the agent harness. Optional Gemma audio correction. Core pipeline about 5 minutes for a twenty-minute handover.</desc>

  <rect x="0" y="0" width="1120" height="560" fill="#ffffff"/>

  <!-- markers -->
  <defs>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b6b6b"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6f63d4"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c25038"/></marker>
  </defs>

  <!-- legend -->
  <g font-size="17" fill="#3a3a3a">
    <rect x="250" y="24" width="16" height="16" rx="3" fill="#1b6a51"/><text x="274" y="37">capture · ASR</text>
    <rect x="430" y="24" width="16" height="16" rx="3" fill="#4a3f9c"/><text x="454" y="37">analysis (LLM)</text>
    <rect x="632" y="24" width="16" height="16" rx="3" fill="#7c3020"/><text x="656" y="37">human loop</text>
    <rect x="852" y="24" width="16" height="16" rx="3" fill="none" stroke="#9a9a9a" stroke-dasharray="3 3"/><text x="876" y="37">optional</text>
  </g>

  <!-- flow arrows (main column, x=550) -->
  <g fill="none" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ag)">
    <path d="M550,120 L550,138"/>
    <path d="M550,196 L550,214"/>
    <path d="M550,272 L550,290"/>
    <path d="M550,348 L550,366"/>
    <path d="M550,424 L550,442"/>
  </g>

  <!-- taxonomie -> détection -->
  <path d="M812,206 L776,222" fill="none" stroke="#6b6b6b" stroke-width="2" marker-end="url(#ag)"/>
  <text x="786" y="250" font-size="13" fill="#7a7a7a">entities</text>

  <!-- audio correction dashed links -->
  <g fill="none" stroke="#6f63d4" stroke-width="2" stroke-dasharray="5 4">
    <path d="M772,240 L796,278" marker-end="url(#ap)"/>
    <path d="M796,320 L774,304" marker-end="url(#ap)"/>
  </g>

  <!-- human loop (corrections -> biais ASR) -->
  <path d="M330,472 L190,472 L190,168 L328,168" fill="none" stroke="#c25038" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ar)"/>
  <path d="M330,486 L152,486 L152,244 L328,244" fill="none" stroke="#c25038" stroke-width="2" stroke-dasharray="2 4" marker-end="url(#ar)"/>
  <text x="248" y="290" font-size="14" fill="#8a8a8a" text-anchor="middle">corrections</text>
  <text x="248" y="308" font-size="14" fill="#8a8a8a" text-anchor="middle">→ ASR bias</text>
  <text x="248" y="336" font-size="13" fill="#a06a5a" text-anchor="middle">entity memory</text>
  <text x="248" y="352" font-size="13" fill="#a06a5a" text-anchor="middle">(same zone) → candidates</text>

  <!-- main boxes -->
  <!-- 1. ingestion (grey) -->
  <rect x="330" y="64" width="440" height="56" rx="11" fill="#45443f"/>
  <text x="550" y="90" text-anchor="middle" font-size="20" font-weight="700" fill="#f2f1ec">media ingestion</text>
  <text x="550" y="109" text-anchor="middle" font-size="14" fill="#b7b6b0">audio → 16 kHz WAV · video → mp4 · ~1 s</text>

  <!-- 2. ASR + diarisation (green) -->
  <rect x="330" y="140" width="440" height="56" rx="11" fill="#1b6a51"/>
  <text x="550" y="166" text-anchor="middle" font-size="19" font-weight="700" fill="#eafff6">ASR + diarisation + alignment</text>
  <text x="550" y="185" text-anchor="middle" font-size="14" fill="#83d4b7">whisper.cpp ×20 · pyannote ×26 · wav2vec2 ×80</text>

  <!-- 3. détection d'entities (purple) -->
  <rect x="330" y="216" width="440" height="56" rx="11" fill="#4a3f9c"/>
  <text x="550" y="242" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">entity detection + matching</text>
  <text x="550" y="261" text-anchor="middle" font-size="12.5" fill="#bcb4ec">probable tags · doubt (acoustic + confident words) · gazetteer · near-miss · G2P · zone memory · 0.7 s</text>

  <!-- 4. moments (purple) -->
  <rect x="330" y="292" width="440" height="56" rx="11" fill="#4a3f9c"/>
  <text x="550" y="318" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">moments · qwen3:8b</text>
  <text x="550" y="337" text-anchor="middle" font-size="14" fill="#bcb4ec">extraction · facts · sections · links · summary · 2 min 40</text>

  <!-- 5. sorties (grey) -->
  <rect x="330" y="368" width="440" height="56" rx="11" fill="#45443f"/>
  <text x="550" y="394" text-anchor="middle" font-size="20" font-weight="700" fill="#f2f1ec">outputs + timeline.html</text>
  <text x="550" y="413" text-anchor="middle" font-size="14" fill="#b7b6b0">moments · transcript · html · render 8 ms</text>

  <!-- 6. annotations (dark red) -->
  <rect x="330" y="444" width="440" height="56" rx="11" fill="#7c3020"/>
  <text x="550" y="470" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">annotations.jsonl</text>
  <text x="550" y="489" text-anchor="middle" font-size="14" fill="#e1b6a9">confirmed human corrections</text>

  <!-- side: domain taxonomy (grey) -->
  <rect x="800" y="150" width="300" height="56" rx="11" fill="#45443f"/>
  <text x="950" y="176" text-anchor="middle" font-size="19" font-weight="700" fill="#f2f1ec">domain taxonomy</text>
  <text x="950" y="195" text-anchor="middle" font-size="14" fill="#b7b6b0">entity glossary</text>

  <!-- side: audio correction (purple, dashed = optional) -->
  <rect x="800" y="262" width="300" height="74" rx="11" fill="#4a3f9c" stroke="#8a80e0" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="950" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">audio correction</text>
  <text x="950" y="308" text-anchor="middle" font-size="13.5" fill="#bcb4ec">Gemma · doubtful spans</text>
  <text x="950" y="326" text-anchor="middle" font-size="13.5" fill="#bcb4ec">~56 min · optional</text>

  <!-- side: core pipeline (olive badge) -->
  <rect x="800" y="372" width="300" height="60" rx="11" fill="#33430f" stroke="#55731a" stroke-width="1.5"/>
  <text x="950" y="399" text-anchor="middle" font-size="19" font-weight="700" fill="#dde8c0">core pipeline</text>
  <text x="950" y="419" text-anchor="middle" font-size="14" fill="#a7bc7d">≈ 5 min per 20-min handover</text>
</svg>
